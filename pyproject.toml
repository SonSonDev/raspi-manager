[project]
name = "raspi-manager"
version = "0.1.0"
description = "Manage apps, environment variables and routing on your Raspberry Pi from Windows, over SSH."
authors = [
    { name = "sonsondev", email = "tsvincent.pham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "pyside6-essentials>=6.12.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
raspi-manager = "raspi:main"
raspi = "raspi:main"   # short alias kept from the old name
rpim = "raspi:main"    # shortest alias

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "raspi"  # the Python package keeps its name; only the project is renamed

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
