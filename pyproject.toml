[project]
name = "raspi"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "sonsondev", email = "tsvincent.pham@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "pyside6-essentials>=6.12.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
raspi = "raspi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
