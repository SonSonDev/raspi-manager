<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}raspi-manager{% endblock %}</title>
<style>
  :root {
    --bg:#fff; --ink:#111418; --muted:#5b6168; --rule:#d5d8dc; --accent:#0b57d0; --on-accent:#fff;
    --ok:#1b6e3a; --warn:#8a5a00; --err:#b3261e; --info:#5b6168;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1013; --ink:#e7e9ec; --muted:#9aa1a9; --rule:#2a2f35; --accent:#7aa7ff; --on-accent:#0e1013;
            --ok:#5fd08a; --warn:#e3b341; --err:#ff8a80; --info:#9aa1a9; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--sans); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--rule); padding-bottom:8px; }
  h1 { font-size:20px; margin:0; line-height:1.15; }
  h2 { font-size:16px; margin:24px 0 0; line-height:1.15; }
  h2 small { color:var(--muted); font:13px var(--mono); margin-left:8px; }
  a { color:var(--accent); }
  a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .checked { color:var(--muted); font-size:12px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th { text-align:left; font-weight:600; font-size:12px; color:var(--muted); border-bottom:1px solid var(--rule); padding:4px 8px; }
  td { height:36px; padding:0 8px; border-bottom:1px solid var(--rule); }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .s-running { color:var(--ok); } .s-stopped,.s-unknown { color:var(--muted); }
  .s-failed { color:var(--err); } .s-working { color:var(--info); }
  .state { font-weight:600; white-space:nowrap; }
  .err { color:var(--err); border-left:3px solid var(--err); padding:8px 12px; margin-top:12px; }
  .ok { color:var(--ok); border-left:3px solid var(--ok); padding:8px 12px; margin-top:12px; }
  .empty { color:var(--muted); margin-top:12px; }
  .actions { white-space:nowrap; text-align:right; }
  .actions form { display:inline; }
  .btn { font:inherit; display:inline-block; min-height:28px; padding:2px 10px; border:1px solid var(--rule); background:transparent;
         color:var(--accent); text-decoration:none; cursor:pointer; border-radius:2px; }
  .btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .btn.danger { color:var(--err); }
  .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  pre { font:12px/1.5 var(--mono); overflow:auto; border:1px solid var(--rule); padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  @media (max-width:600px) { .hide-sm { display:none; } td { height:44px; } .btn { min-height:44px; } }
  @media (prefers-reduced-motion: no-preference) { .btn { transition:background-color 120ms ease-out; } }
</style>
</head>
<body>
<main>
  <header>
    <h1><a href="/" style="color:inherit;text-decoration:none">raspi-manager</a></h1>
    {% block headerlink %}<a href="/" aria-keyshortcuts="r">Refresh (r)</a>{% endblock %}
  </header>
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
